<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members — CampusSync</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D0D12'/><rect x='20' y='20' width='25' height='25' rx='4' fill='%23E85D4C'/><rect x='55' y='20' width='25' height='25' rx='4' fill='%234A9D97'/><rect x='20' y='55' width='25' height='25' rx='4' fill='%23C77E5B'/><rect x='55' y='55' width='25' height='25' rx='4' fill='%237BA38C'/></svg>">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <nav class="navbar" style="padding-left: 240px;">
        <div class="container flex-between" style="height: 100%; max-width: none;">
            <div class="flex-center" style="gap: 1rem;">
                <select id="clubSwitcher">
                    <option value="ai-robotics">AI & Robotics Club</option>
                </select>
            </div>
            <div class="flex-center" style="gap: 1.5rem;">
                <button class="btn btn-ghost" style="font-size: 1.2rem; padding: 0.5rem;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </button>
                <div style="width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent) 0%, var(--copper) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; cursor: pointer;">DM</div>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar" role="navigation" aria-label="Sidebar Navigation">
            <a href="index.html" class="nav-brand">Campus<span>Sync</span></a>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Dashboard
                </a>
                <a href="members.html" class="nav-link active">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Members
                </a>
                <a href="events.html" class="nav-link">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Events
                </a>
                <a href="health.html" class="nav-link">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    Community Health
                </a>
                <a href="planner.html" class="nav-link">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    Event Planner
                </a>
                <a href="connect.html" class="nav-link">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><circle cx="17" cy="12" r="3"/><path d="M3 21v-2a4 4 0 0 1 4-4h4"/></svg>
                    Member Connect
                </a>
                <a href="settings.html" class="nav-link">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Settings
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="flex-between animate-in" style="margin-bottom: 2rem;">
                <div>
                    <h1>Club Members</h1>
                    <p style="color: var(--text-muted);">Manage and view all members of the AI & Robotics Club.</p>
                </div>
                <button class="btn btn-primary">+ Add Member</button>
            </div>

            <div class="card animate-in delay-1" style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center;">
                <div style="flex: 1;">
                    <input type="text" placeholder="Search members by name or interest...">
                </div>
                <select>
                    <option>All Statuses</option>
                    <option>Active</option>
                    <option>At-Risk</option>
                    <option>Inactive</option>
                </select>
            </div>

            <div id="statsBar" class="grid animate-in delay-2" style="grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem;">
                <!-- Injected by JS -->
            </div>

            <div id="memberGrid" class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 1.5rem;">
                <!-- Injected by JS -->
            </div>
        </main>
    </div>

    <script src="./static/js/data.js"></script>
    <script src="./static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('appReady', () => {
                const comm = window.state.currentCommunity;
                const firebaseCommunityId = localStorage.getItem('firebase_community_id');
                
                if (firebaseCommunityId && comm && comm.id === firebaseCommunityId) {
                    const switcher = document.getElementById('clubSwitcher');
                    // Add community to switcher if not there
                    if (![...switcher.options].some(opt => opt.value === comm.id)) {
                        const newOption = document.createElement('option');
                        newOption.value = comm.id;
                        newOption.text = `${comm.name} · ${comm.size} members`;
                        newOption.selected = true;
                        switcher.add(newOption, 0);
                    } else {
                        switcher.value = comm.id;
                    }
                }
                renderMembers();
            });

            if (window.state && window.state.currentCommunity) {
                renderMembers();
            }
        });

        function renderMembers() {
            const grid = document.getElementById('memberGrid');
            const stats = document.getElementById('statsBar');

            const members = window.state.members;

            // Render Stats
            const counts = {
                total: members.length,
                active: members.filter(m => m.status === 'active').length,
                atRisk: members.filter(m => m.status === 'at-risk').length,
                inactive: members.filter(m => m.status === 'inactive').length
            };

            stats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total</div>
                    <div class="stat-value">${counts.total}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active</div>
                    <div class="stat-value sage">${counts.active}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">At-Risk</div>
                    <div class="stat-value gold">${counts.atRisk}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Inactive</div>
                    <div class="stat-value accent">${counts.inactive}</div>
                </div>
            `;

            // Render Grid
            grid.innerHTML = members.map((m, i) => `
                <div class="card animate-in" style="animation-delay: ${0.3 + i * 0.05}s;">
                    <div class="flex" style="gap: 1rem; margin-bottom: 1rem;">
                        <div class="member-avatar ${getAvatarClass(m.status)}">${m.name.charAt(0)}</div>
                        <div>
                            <div style="font-weight: 700;">${m.name}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${m.role} · ${m.year}</div>
                        </div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <span class="badge badge-${m.status}">${m.status}</span>
                    </div>
                    <div class="flex" style="flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem;">
                        ${m.interests.map(i => `<span class="interest-tag">${i}</span>`).join('')}
                    </div>
                    <div class="flex-between" style="border-top: 1px solid var(--border-subtle); padding-top: 1rem;">
                        <span style="font-size: 0.75rem; color: var(--text-muted);">Last active: ${m.daysInactive}d ago</span>
                        <div class="flex" style="gap: 0.5rem;">
                            <button class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">View</button>
                            <button class="btn btn-primary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">Message</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getAvatarClass(status) {
            if (status === 'at-risk') return 'gold';
            if (status === 'inactive') return '';
            return 'teal';
        }
    </script>
</body>
</html>
